<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advice Generator App</title>
  <!-- Aquí conectaremos nuestro CSS más adelante -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card-container">
    <!-- Aquí va el numerito del consejo -->
    <h1 class="advice-id">ADVICE #<span id="advice-number">117</span></h1>
    
    <!-- Aquí va el texto del consejo que traeremos con la API -->
    <p class="advice-text" id="advice-text">
      "It is easy to sit up and take notice, what's difficult is getting up and taking action."
    </p>
    
    <!-- Este es el botón del dadito que el usuario va a presionar -->
    <button class="dice-btn" id="generate-btn">
      🎲
    </button>
  </main>

  <!-- Aquí conectaremos nuestro JavaScript más adelante -->
  <script src="app.js"></script>
</body>
</html>
